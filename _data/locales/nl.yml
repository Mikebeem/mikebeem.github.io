# The layout text of site

# ----- Commons label -----

layout:
  post: post
  category: Categorie
  tag: Tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Home
  categories: Categorieen
  tags: Tags
  archives: Archief
  about: Over

# the text displayed in the search bar & search results
search:
  hint: Zoeken
  cancel: Annuleren
  no_results: Oeps! Geen resultaten gevonden.

panel:
  lastmod: Recent bijgewerkt
  trending_tags: Populaire tags
  toc: Inhoud

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Sommige rechten voorbehouden.
  verbose: >-
    Tenzij anders vermeld, vallen de blogartikelen op deze site onder de
    Creative Commons Attribution 4.0 International (CC BY 4.0) licentie van de auteur.

meta: Gebruikt het :THEME-thema voor :PLATFORM.

not_found:
  statement: Sorry, deze pagina bestaat niet of de link klopt niet meer.

notification:
  update_found: Er is een nieuwe versie van de inhoud beschikbaar.
  update: Bijwerken

# ----- Posts related labels -----

post:
  written_by: Door
  posted: Gepost
  updated: Bijgewerkt
  words: woorden
  pageview_measure: weergaven
  read_time:
    unit: min
    prompt: lezen
  relate_posts: Verder lezen
  share: Delen
  button:
    next: Nieuwer
    previous: Ouder
    copy_code:
      succeed: Gekopieerd!
    share_link:
      title: Kopieer link
      succeed: Link gekopieerd!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: categorie
    plural: categorieen
  post_measure:
    singular: bericht
    plural: berichten
